<!doctype html>
<html lang="zh-CN" data-profile="I" data-theme="light" data-texture="on">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务依赖 · 层次与表达实验</title>
<link rel="stylesheet" href="../../../standards/interface-capability/tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="inspection.css">
<body>
<a class="skip" href="#content">跳到工作内容</a>
<header class="experiment"><a href="../README.md">DCL / 设计实验</a><nav aria-label="表达方案"><button data-view="G" aria-pressed="false">G 工作台</button><button data-view="H" aria-pressed="false">H 研判页</button><button data-view="I" aria-pressed="true">I 任务排查</button></nav><label>样例<select id="scenario"><option value="baseline">多项前置</option><option value="clear">前置全部满足</option><option value="manual">人工阻塞</option><option value="missing">缺失引用</option><option value="cycle">循环关系</option><option value="dense">多分支与长标题</option></select></label><button id="theme">切换深浅</button><label class="toggle"><input type="checkbox" id="texture" checked><span id="texture-label">氛围图</span></label></header>
<div class="shell"><aside class="navigation"><a class="wordmark" href="../README.md"><span class="mark" aria-hidden="true">↗</span><span>项目<br><b>总控台</b></span></a><div class="navlinks"><span>工作</span><span>项目</span><strong aria-current="page">任务依赖 <b>↗</b></strong><span>资料</span><span>记录</span></div><div class="nav-foot"><span class="live-dot"></span>本地合成数据<p>查看与排查<br>不会修改任务状态。</p><a href="../prototypes/index.html">查看 A—F 基线 →</a></div></aside>
<main id="content" tabindex="-1">
  <div class="section-label"><span>工作 / 任务依赖</span><span id="profile-label">任务排查</span></div>
  <details id="task-tools">
    <summary>切换任务与筛选</summary>
    <div class="filters">
      <label>项目范围<select id="scope"><option value="all">全部项目</option></select></label>
      <label class="search">查找对象<input id="query" type="search" placeholder="名称或编号"></label>
      <label class="toggle"><input id="done" type="checkbox">隐藏已满足前置</label>
    </div>
    <label id="inspection-picker-label">排查任务<select id="inspection-picker" aria-describedby="inspection-filter-result"></select></label>
    <div class="inspection-filter-feedback">
      <p id="inspection-filter-result" role="status"></p>
      <button id="inspection-clear-filters" type="button" hidden>清除项目与搜索筛选</button>
    </div>
  </details>
  <section id="surface" aria-label="任务依赖工作区"></section>
  <p id="announce" class="sr" role="status" aria-live="polite"></p>
  <footer>任务依赖实验 · 本地合成数据</footer>
</main></div>
<script src="../prototypes/data.js"></script><script src="extra-cases.js"></script><script src="inspection.js"></script><script src="app.js"></script>
</body></html>
